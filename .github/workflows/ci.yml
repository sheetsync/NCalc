name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - main
      - "codex/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  CONFIGURATION: Release
  CORE_PROJECT: Evaluant.Calculator/NCalc.csproj
  TEST_PROJECT: Evaluant.Calculator.Tests/NCalc.Tests.csproj
  DOTNET_NOLOGO: true

jobs:
  quality-gates:
    name: Local quality gates and compatibility
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install Mono runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes mono-runtime

      - name: Run local validation gates
        run: scripts/validate.sh

  build-test-pack:
    name: Restore, build, test, and pack (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Show .NET information
        run: dotnet --info

      - name: Restore
        run: |
          dotnet restore ${{ env.CORE_PROJECT }}
          dotnet restore ${{ env.TEST_PROJECT }}

      - name: Build
        run: |
          dotnet build ${{ env.CORE_PROJECT }} --configuration ${{ env.CONFIGURATION }} --no-restore
          dotnet build ${{ env.TEST_PROJECT }} --configuration ${{ env.CONFIGURATION }} --no-restore

      - name: Test
        run: >
          dotnet test ${{ env.TEST_PROJECT }}
          --configuration ${{ env.CONFIGURATION }}
          --no-build
          --logger "trx;LogFileName=test-results.trx"
          --results-directory TestResults

      - name: Pack
        run: >
          dotnet pack ${{ env.CORE_PROJECT }}
          --configuration ${{ env.CONFIGURATION }}
          --no-build
          --output artifacts/packages
          /p:ContinuousIntegrationBuild=true
          /p:IncludeSymbols=true
          /p:SymbolPackageFormat=snupkg

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults
          if-no-files-found: ignore

      - name: Upload NuGet package
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package-${{ matrix.os }}
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
          if-no-files-found: error
